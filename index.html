<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>アルカの塔 〜百層の物語〜</title>
<link rel="preload" as="image" href="assets/title-keyart-v3.png">
<link rel="preload" as="image" href="assets/v5/hero-field-v5.webp">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #101c35 0, #050711 52%, #000 100%);
  }
  canvas {
    image-rendering: auto;
    background: #000;
    box-shadow: 0 0 0 1px #2d3b57, 0 0 46px rgba(44,94,151,.32), 0 18px 54px #000;
  }
  #hint {
    position: fixed; bottom: 6px; left: 0; right: 0;
    text-align: center;
    color: #74849b; font-family: monospace; font-size: 11px;
    pointer-events: none;
  }
  #touch-controls {
    display: none;
    position: fixed; z-index: 20; inset: 0;
    pointer-events: none;
  }
  .touch-ui #touch-controls { display: block; }
  .touch-ui #hint { display: none; }
  .dpad {
    position: absolute;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
    display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 2px;
    pointer-events: auto; opacity: .48;
    filter: drop-shadow(0 8px 15px rgba(0,0,0,.65));
    transition: opacity .12s ease, filter .12s ease;
  }
  .dpad [data-key="up"] { grid-column: 2; grid-row: 1; }
  .dpad [data-key="left"] { grid-column: 1; grid-row: 2; }
  .dpad [data-key="right"] { grid-column: 3; grid-row: 2; }
  .dpad [data-key="down"] { grid-column: 2; grid-row: 3; }
  .touch-actions {
    position: absolute;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
    display: flex; align-items: flex-end; gap: 10px;
    pointer-events: auto; opacity: .48;
    filter: drop-shadow(0 8px 15px rgba(0,0,0,.65));
    transition: opacity .12s ease, filter .12s ease;
  }
  .dpad.is-active, .touch-actions.is-active { opacity: .96; filter: drop-shadow(0 6px 12px rgba(0,0,0,.8)); }
  .touch-button {
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid rgba(222,190,111,.9); color: #fff; background: rgba(9,25,42,.76);
    box-shadow: inset 0 0 0 2px rgba(79,139,156,.82), 0 3px 10px rgba(0,0,0,.55);
    font: 700 18px/1 sans-serif; -webkit-tap-highlight-color: transparent;
    touch-action: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  }
  .touch-button:active, .touch-button.is-held { background: rgba(46,116,137,.96); transform: translateY(2px) scale(.97); }
  .touch-button.ok { width: 70px; height: 70px; background: rgba(92,37,47,.82); }
  .touch-button.cancel { font-size: 13px; }
  @media (orientation: landscape) and (max-height: 600px) {
    .touch-ui .dpad {
      left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom));
      grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); opacity: .42;
    }
    .touch-ui .touch-actions { right: max(10px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); opacity: .42; }
    .touch-ui .dpad.is-active, .touch-ui .touch-actions.is-active { opacity: .94; }
    .touch-ui .touch-button { width: 48px; height: 48px; }
    .touch-ui .touch-button.ok { width: 62px; height: 62px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="1024" height="896"></canvas></div>
<div id="hint">矢印キー:移動 / Z・Enter:はなす・しらべる・決定 / X・Esc:メニュー・キャンセル</div>
<div id="touch-controls" aria-label="ゲーム操作">
  <div class="dpad" aria-label="移動">
    <button class="touch-button" data-key="up" aria-label="上">▲</button>
    <button class="touch-button" data-key="left" aria-label="左">◀</button>
    <button class="touch-button" data-key="right" aria-label="右">▶</button>
    <button class="touch-button" data-key="down" aria-label="下">▼</button>
  </div>
  <div class="touch-actions">
    <button class="touch-button cancel" data-key="cancel" aria-label="戻る・メニュー">戻る<br>メニュー</button>
    <button class="touch-button ok" data-key="ok" aria-label="決定・話す">決定</button>
  </div>
</div>
<script src="js/audio.js?v=2"></script>
<script src="js/art-v3.js?v=7"></script>
<script src="js/chars-v3.js?v=6"></script>
<script src="js/data.js?v=5"></script>
<script src="js/maps.js?v=8"></script>
<script src="js/battle.js?v=17"></script>
<script src="js/game.js?v=31"></script>
</body>
</html>
