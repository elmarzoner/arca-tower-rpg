<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>アルカの塔 Visual System III</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b13;color:#dce8ee;font-family:monospace}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0 60px}h1{margin:0;color:#e5c66d;font:700 36px serif;letter-spacing:.05em}h2{margin-top:34px;color:#75e1e6;border-bottom:1px solid #34505d;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}.card{background:linear-gradient(#14243a,#090f20);border:1px solid #536c84;padding:8px;text-align:center}.card canvas{width:96px;height:96px;image-rendering:auto;background:radial-gradient(circle,#30465b,#111a2a);display:block;margin:auto}.card b{display:block;margin-top:6px;font-size:11px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}.tier{background:#101827;border:1px solid #40546b;padding:10px}.tier canvas{width:100%;height:auto;image-rendering:auto;display:block}.tier span{display:block;margin-top:7px;color:#b6c6d2}.battle{width:100%;height:auto;display:block;border:1px solid #40546b}</style></head>
<body><main><h1>VISUAL SYSTEM III</h1><p>新規タイル、通常魔物、十人の守り手の描画確認シート。</p><h2>10 LAYER TILE SETS</h2><section class="tiles" id="tiles"></section><h2>BATTLE STAGE</h2><canvas class="battle" id="battle" width="1024" height="896"></canvas><h2>MONSTERS &amp; GUARDIANS</h2><section class="grid" id="sprites"></section></main>
<script src="../js/art-v3.js?v=7"></script><script src="../js/data.js?v=3"></script><script>
Art.init();const ts=document.getElementById('tiles');for(let i=0;i<Art.TIER_THEMES.length;i++){const d=document.createElement('div');d.className='tier';const c=document.createElement('canvas');c.width=1536;c.height=64;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(Art.getTileSheet(i),0,0);d.append(c);const s=document.createElement('span');s.textContent=`${i}: ${Art.TIER_THEMES[i].name}`;d.append(s);ts.append(d)}
const bc=document.getElementById('battle'),bg=bc.getContext('2d');bg.scale(2,2);Art.drawBattleBackdrop(bg,6,1.4);const bm=Art.get('b_makinas');bg.drawImage(bm,176,90,160,160);
const seen=new Set(),box=document.getElementById('sprites');for(const m of Object.values(MONSTERS)){if(seen.has(m.spr))continue;seen.add(m.spr);const d=document.createElement('div');d.className='card';const c=document.createElement('canvas');c.width=96;c.height=96;const g=c.getContext('2d');g.imageSmoothingEnabled=false;const im=Art.get(m.spr);if(im){const sc=Math.min(88/im.width,88/im.height);g.drawImage(im,48-im.width*sc/2,48-im.height*sc/2,im.width*sc,im.height*sc)}d.append(c);const b=document.createElement('b');b.textContent=m.name;d.append(b);box.append(d)}
</script></body></html>
